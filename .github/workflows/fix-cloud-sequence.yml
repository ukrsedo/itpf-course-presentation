name: Fix cloud sequence
on:
  push:
    paths:
      - '.github/workflows/fix-cloud-sequence.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair cloud slide sequence and labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove the duplicate physical slide 38. AI-Enabled Sourcing Risk remains at 58.
          p38 = Path('approved-slides/slide-38-approved.html')
          if p38.exists():
              p38.unlink()

          # Correct Case #2 internal labels without changing its descriptive content.
          p41 = Path('approved-slides/slide-41-approved.html')
          s41 = p41.read_text()
          s41 = s41.replace('<div class="kicker">Case 3</div>', '<div class="kicker">Case #2</div>')
          s41 = s41.replace('<h2>Open Case 3</h2>', '<h2>Open Case #2</h2>')
          s41 = s41.replace('aria-label="Case 3 transition"', 'aria-label="Case #2 transition"')
          p41.write_text(s41)

          # Main presentation index: remove n=38 only; preserve logical slide numbers 39 onward.
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('IT Procurement Foundations — 87-slide presentation', 'IT Procurement Foundations — 86-slide presentation')
          s = s.replace('1 / 87', '1 / 86')
          s = re.sub(r'\{"n":38,"title":"[^"]*","src":"approved-slides/slide-38-approved\.html"\},', '', s, count=1)
          replacements = {
              '"n":39,"title":"Cloud Services"': '"n":39,"title":"Cloud Deployment Models"',
              '"n":40,"title":"Cloud Repatriation"': '"n":40,"title":"Cloud Services"',
              '"n":41,"title":"Buy or Build?"': '"n":41,"title":"Case #2"',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'index target not found: {old}')
              s = s.replace(old,new,1)
          p.write_text(s)

          # Static slide index: remove slide 38 card and correct 39-41 labels/count.
          p = Path('slide-index.html')
          s = p.read_text()
          s = s.replace('ITPF 87-slide index', 'ITPF 86-slide index')
          s = s.replace('87 slides. Technology Procurement Framework:', '86 slides. Technology Procurement Framework:')
          s = re.sub(r'<a class="slide" href="approved-slides/slide-38-approved\.html"><span class="num">38</span><span class="t">.*?</span></a>\n?', '', s, count=1)
          replacements = {
              '<span class="num">39</span><span class="t">Cloud Services</span>': '<span class="num">39</span><span class="t">Cloud Deployment Models</span>',
              '<span class="num">40</span><span class="t">Cloud Repatriation</span>': '<span class="num">40</span><span class="t">Cloud Services</span>',
              '<span class="num">41</span><span class="t">Buy or Build?</span>': '<span class="num">41</span><span class="t">Case #2</span>',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'slide-index target not found: {old}')
              s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          test ! -e approved-slides/slide-38-approved.html
          grep -F '"n":39,"title":"Cloud Deployment Models"' index.html
          grep -F '"n":40,"title":"Cloud Services"' index.html
          grep -F '"n":41,"title":"Case #2"' index.html
          grep -F '"n":42,"title":"Technology Procurement Framework — SaaS"' index.html
          grep -F '"n":43,"title":"Buy or Build?"' index.html
          grep -F '<div class="kicker">Case #2</div>' approved-slides/slide-41-approved.html
          grep -F '<h2>Open Case #2</h2>' approved-slides/slide-41-approved.html
          test "$(grep -o '"n":[0-9]\+' index.html | wc -l)" -eq 86
          ! grep -F 'approved-slides/slide-38-approved.html' index.html
          ! grep -F 'approved-slides/slide-38-approved.html' slide-index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove duplicate slide 38 and fix cloud sequence labels'
          git push
