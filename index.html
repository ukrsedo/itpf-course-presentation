const assistantPanel=document.getElementById('assistantPanel');
const assistantClose=document.getElementById('assistantClose');
const assistantTitle=document.getElementById('assistantTitle');
const assistantBody=document.getElementById('assistantBody');
const ASSISTANT_ENDPOINT='https://itpf-course-assistant.ukrsedo-e2e.workers.dev/explain-slide';

const assistantFallbackExplanations={"75":"Slide 75 uses US defence AI procurement guidance as a contract review exercise. The case tab is self-contained: it summarises the guidance and provides five table rows with full questions about evidence of compliance, testing suitability, error versus breach, verification and disputes with correction deadlines, and model changes with retesting and acceptance. Learners answer every row and propose contract additions before opening the critical contract provisions tab. Each of the five rows also includes a short suggested-solution list, including standardised datasets and authoritative references, buyer acceptance testing, breach severity and correction deadlines, independent verification and disputes, and regression testing with reacceptance. The source link is for reference only; reading the PDF is not required. The key gaps are testing methodology, objective criteria, dispute resolution, and change controls with reacceptance. The source requires a supplier investigation and response within 15 business days, not resolution within that period. The templates are adaptable, and other procurement documents could supply additional controls. The checklist is proposed buyer contract design, not a statement of requirements in the guidance. Hallucination controls need an agreed definition of fabricated or unsupported factual claims, a measurable SLA, sampling and validation, correction deadlines, supplier-funded retraining and buyer reacceptance. Avoid assuming error-free AI or that retraining alone will correct every failure. Retain data and IP, service and security, liability and exit protections. Source: https://www.acq.osd.mil/dpap/policy/policyvault/USA001389-26-DPCAP.pdf","19":"ADB’s guide distinguishes the bidding approach according to the complexity of the IT purchase.\n\nSingle-stage bidding suits straightforward IT products and services. Where the lowest evaluated price among substantially responsive bids achieves value for money, the guide identifies the goods bidding document. Where technical quality needs point scoring, it identifies the IT products and services bidding document. One-envelope and two-envelope are variants within single-stage bidding. The two-envelope variant allows technical and administrative evaluation without reference to price.\n\nTwo-stage bidding suits complex systems, applications and transformational IT projects. The first stage requests technical proposals without prices, often based on business and functional requirements. Structured technical discussions clarify conformity and gaps and may lead to revised specifications and bidding documents. The purchaser records its understanding with each bidder. Sufficiently responsive bidders then submit revised technical proposals and financial proposals in the second stage.\n\nThe procurement lesson is to match the process to subject complexity and specification maturity. A two-stage process develops and clarifies the technical basis before final priced bids. It is not a generic innovation sandbox or a public-private partnership route.\n\nSource: ADB, User Guide for Procurement of Information Technology Products and Services, December 2021, printed pages 5–6. https://www.adb.org/documents/procurement-ict-guide","46":"This slide links software-buying behaviour to pricing choices. G2's 2026 survey reports more AI-assisted discovery, longer security reviews, greater finance involvement and demand for shorter commitments. Its percentages describe survey respondents, not every software buyer.\n\nOutcome-based pricing is a subset of value-based pricing. Value-based pricing uses customer value to set the price. Outcome-based pricing makes the outcome-linked fee conditional on a defined, verified result. A subscription can be value-based without depending on realised outcomes. Usage pricing charges for consumption, which does not itself prove success.\n\nFor procurement, agree the success event, quality threshold, attribution and verification evidence. Define exclusions, reopened or duplicate cases, measurement windows and audit rights. Check base fees, minimums, caps and overages. The support-resolution example is illustrative. The key decision is whether the outcome can be measured fairly and whether the resulting charges remain controllable.","49":"The Benchmarkit report primarily describes CY2025 supplier economics.\n\nVertical SaaS has median CLTV:CAC of 5.6x versus 4.1x for horizontal SaaS, about 37% higher lifetime value per acquisition dollar. This does not establish customer value, vendor profitability, discount capacity or the cause of the difference. The report also shows higher new-name CAC for vertical SaaS, so a higher CLTV:CAC ratio must not be presented as lower acquisition cost.\n\nRetention protects existing ARR. The report does not provide a comparable retention-cost ratio, and renewal and customer-success work still carry costs. Expansion adds ARR to existing accounts and has a median S&M cost of $0.80 per $1 of expansion ARR. Acquiring a new customer has a median of $1.63 per $1 of new-customer ARR. Expansion is approximately 51% cheaper on this measure. For $100,000 of additional ARR, applying these medians implies $80,000 versus $163,000 of S&M, a difference of $83,000. These are supplier sales and marketing ratios, not customer fees or total delivery costs. Separate medians are directional benchmarks, not a matched comparison of the same companies.\n\nCAC payback shortened from 18 to 16 months, about 11%. Blended CAC fell from $1.40 to $1.30, about 7%. Rule of 40 improved from 15% to 25%, remaining 15 percentage points below 40. Separate medians cannot construct a representative P&L.\n\nThe Atlassian tab retains the supplied unaudited FY2026 statement and calculations. High gross margin can coexist with a net loss. Use supplier-specific financial evidence.\n\nSource: Benchmarkit, 2026 SaaS and AI Metrics Benchmarks. https://www.benchmarkit.ai/_files/ugd/2a084b_f19d7f96a9e24aba9202e01224d0dbcc.pdf"};
// Keep deployed assistant content IDs stable when presentation positions change.
let assistantUsesNewNumbers;
async function resolveAssistantNumbering(){
 if(assistantUsesNewNumbers!==undefined)return assistantUsesNewNumbers;
 try{const r=await fetch(ASSISTANT_ENDPOINT.replace('/explain-slide','/health'));const h=await r.json();assistantUsesNewNumbers=h.slidesInDeck===80&&String(h.version||'').includes('80-slides-outcomes');}catch{assistantUsesNewNumbers=false;}
 return assistantUsesNewNumbers;
}
const explanationCache=new Map();
let assistantRequestController=null;
let current=0;
slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(s.n).padStart(2,'0')+' — '+s.title;picker.appendChild(o)});
function flash(text){toast.textContent=text;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),900)}
function setAssistantOpen(open){
  assistantPanel.classList.toggle('open',open);
  framewrap.classList.toggle('assistant-open',open);
  assistantPanel.setAttribute('aria-hidden',open?'false':'true');
  if(!open&&assistantRequestController){assistantRequestController.abort();assistantRequestController=null}
}
function closeAssistant(){setAssistantOpen(false)}
function showAssistantLoading(slide){
  assistantTitle.textContent='Slide '+slide.n+' — '+slide.title.replace(/^ITPF\s*[—-]\s*Slide\s*\d+\s*[—-]?\s*/i,'').replace(/^Slide\s*\d+\s*[—-]?\s*/i,'');
  assistantBody.innerHTML='';
  const status=document.createElement('div');status.className='assistant-status';
  const spinner=document.createElement('span');spinner.className='assistant-spinner';spinner.setAttribute('aria-hidden','true');
  const text=document.createElement('span');text.textContent='Preparing the explanation…';
  status.append(spinner,text);assistantBody.appendChild(status);
}
function showAssistantExplanation(text){
  assistantBody.innerHTML='';
  const div=document.createElement('div');div.className='assistant-explanation';div.textContent=text;assistantBody.appendChild(div);
}
function showAssistantError(message){
  assistantBody.innerHTML='';
  const box=document.createElement('div');box.className='assistant-error';box.textContent=message;assistantBody.appendChild(box);
  const retry=document.createElement('button');retry.type='button';retry.className='assistant-retry';retry.textContent='Try again';retry.onclick=explainCurrentSlide;assistantBody.appendChild(retry);
}
async function explainCurrentSlide(){
  const slide=slides[current];
  setAssistantOpen(true);
  if(explanationCache.has(slide.n)){
    assistantTitle.textContent='Slide '+slide.n+' — '+slide.title.replace(/^ITPF\s*[—-]\s*Slide\s*\d+\s*[—-]?\s*/i,'').replace(/^Slide\s*\d+\s*[—-]?\s*/i,'');
    showAssistantExplanation(explanationCache.get(slide.n));
    return;
  }
  showAssistantLoading(slide);
  if(assistantRequestController)assistantRequestController.abort();
  assistantRequestController=new AbortController();
  const timeout=setTimeout(()=>assistantRequestController.abort(),30000);
  try{
    const useNewNumbers=await resolveAssistantNumbering();
    if(assistantFallbackExplanations[slide.n]){
      const explanation=assistantFallbackExplanations[slide.n];explanationCache.set(slide.n,explanation);if(slides[current].n===slide.n&&assistantPanel.classList.contains('open'))showAssistantExplanation(explanation);return;
    }
    const response=await fetch(ASSISTANT_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slideNumber:useNewNumbers?slide.assistantDeckNumber:slide.assistantLegacyNumber}),
      signal:assistantRequestController.signal
    });
    let data;
    try{data=await response.json()}catch{throw new Error('The Course Assistant returned an unreadable response.')}
    if(!response.ok||!data.success)throw new Error(data.error||data.details||'The Course Assistant could not explain this slide.');
    const explanation=String(data.explanation||'').trim();
    if(!explanation)throw new Error('The Course Assistant returned no explanation.');
    explanationCache.set(slide.n,explanation);
    if(slides[current].n===slide.n&&assistantPanel.classList.contains('open'))showAssistantExplanation(explanation);
  }catch(error){
    if(error.name==='AbortError'){
      if(assistantPanel.classList.contains('open'))showAssistantError('The request timed out. Please try again.');
    }else if(assistantPanel.classList.contains('open')){
      const originHint=location.protocol==='file:'?' Open the presentation from Good Spending or GitHub Pages rather than as a local file.':'';
      showAssistantError((error.message||'The Course Assistant is unavailable.')+originHint);
    }
  }finally{clearTimeout(timeout);assistantRequestController=null}
}
assistantOpen.onclick=explainCurrentSlide;
fsAssistantOpen.onclick=explainCurrentSlide;
assistantClose.onclick=closeAssistant;
assistantPanel.addEventListener('keydown',e=>{if(e.key==='Escape')closeAssistant()});
function show(index,updateHash=true){
  current=Math.max(0,Math.min(slides.length-1,index));
  closeAssistant();
  frame.src=slides[current].src;
  picker.value=String(current);
  counter.textContent=(current+1)+' / '+slides.length;
  fsCounter.textContent=(current+1)+' / '+slides.length;
  prev.disabled=current===0;next.disabled=current===slides.length-1;
  fsPrev.disabled=current===0;fsNext.disabled=current===slides.length-1;
  document.title='Slide '+(current+1)+' — IT Procurement Foundations';
  if(updateHash) history.replaceState(null,'','#'+(current+1));
}
function go(d){show(current+d)}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);fsPrev.onclick=()=>go(-1);fsNext.onclick=()=>go(1);picker.onchange=()=>show(Number(picker.value));
async function toggleDeckFullscreen(){
  try{
    const active=document.fullscreenElement||document.webkitFullscreenElement;
    if(!active){
      const request=framewrap.requestFullscreen||framewrap.webkitRequestFullscreen;
      if(!request) throw new Error('Fullscreen unsupported');
      await request.call(framewrap);
    }else{
      const exit=document.exitFullscreen||document.webkitExitFullscreen;
      if(exit) await exit.call(document);
    }
  }catch(e){flash('Use the browser full-screen command')}
}
document.getElementById('full').onclick=toggleDeckFullscreen;
function keynav(e){
 if(e.key==='Escape'&&assistantPanel.classList.contains('open')){e.preventDefault();closeAssistant();return;}
 const tag=(e.target&&e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select')return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}
 else if(e.key==='Home'){e.preventDefault();show(0)} else if(e.key==='End'){e.preventDefault();show(slides.length-1)}
}
window.addEventListener('keydown',keynav);
window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow||!e.data||e.data.type!=='ITPF_DECK_NAV')return;
  if(e.data.action==='next')go(1);
  else if(e.data.action==='prev')go(-1);
  else if(e.data.action==='first')show(0);
  else if(e.data.action==='last')show(slides.length-1);
  else if(e.data.action==='fullscreen')toggleDeckFullscreen();
});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(Number.isFinite(n)&&n>=1&&n<=slides.length)show(n-1,false)});
const requested=parseInt(location.hash.slice(1),10);show(Number.isFinite(requested)&&requested>=1&&requested<=slides.length?requested-1:0,false);
</script>
</body>
</html>
