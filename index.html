<style>
:root{--bar:#071b2f;--blue:#1484e6;--ink:#eef6ff;--muted:#a9bdd1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b252f;font-family:Arial,Helvetica,sans-serif}
body{display:grid;grid-template-rows:50px minmax(0,1fr)}
.toolbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bar);color:var(--ink);border-bottom:1px solid rgba(255,255,255,.12);z-index:10}
.brand{font-weight:700;font-size:14px;white-space:nowrap;margin-right:4px}

button:disabled{opacity:.35;cursor:default}
select{min-width:250px;max-width:42vw;padding:0 30px 0 10px}

.toast.show{opacity:1}

.fullscreen-nav button:hover{background:#23699f}
.fullscreen-counter{min-width:96px;text-align:center;font:700 14px Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.framewrap:fullscreen .fullscreen-nav{display:flex}
.framewrap:-webkit-full-screen .fullscreen-nav{display:flex}
html:fullscreen .fullscreen-nav{display:flex}

html:fullscreen body{grid-template-rows:minmax(0,1fr)}
html:-webkit-full-screen body{grid-template-rows:minmax(0,1fr)}
.framewrap:fullscreen,.framewrap:-webkit-full-screen{width:100vw;height:100vh;background:#1b252f}

.assistant-button:hover{background:#1484e6}
.assistant-panel{position:absolute;top:0;right:0;width:min(430px,44vw);height:100%;background:#f7fbff;color:#15283a;box-shadow:-8px 0 28px rgba(0,0,0,.32);z-index:2147483646;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;visibility:hidden}

.assistant-header{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;background:#071b2f;color:#fff;border-bottom:1px solid rgba(255,255,255,.15)}
.assistant-heading{min-width:0;flex:1}
.assistant-kicker{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#9fd0fa;margin-bottom:4px}

@keyframes assistant-spin{to{transform:rotate(360deg)}}
.assistant-explanation{white-space:pre-wrap}
.assistant-error{padding:12px;border:1px solid #d6a4a4;background:#fff2f2;border-radius:8px;color:#6d2020}

@media(max-width:760px){body{grid-template-rows:46px minmax(0,1fr)}.toolbar{padding:6px}.brand,.hint{display:none}select{min-width:0;max-width:none;flex:1}button{padding:0 9px}.assistant-panel{width:min(92vw,430px)}.framewrap.assistant-open iframe{width:100%}.fullscreen-nav{gap:7px}.fullscreen-nav .assistant-button{padding:0 10px;font-size:12px}}

"approved-slides/slide-83-approved.html"},{"n":84,"title":"Case #6","src":"approved-slides/slide-84-approved.html"},{"n":85,"title":"ACV vs. TCV in SaaS Contracts","src":"approved-slides/slide-85-approved.html"},{"n":86,"title":"Case #7","src":"approved-slides/slide-86-approved.html"},{"n":87,"title":"Quiz #2","src":"approved-slides/slide-87-approved.html"}];
const framewrap=document.querySelector('.framewrap');
const frame=document.getElementById('slideframe');
const picker=document.getElementById('picker');
const counter=document.getElementById('counter');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
const toast=document.getElementById('toast');
const fsCounter=document.getElementById('fsCounter');
const fsPrev=document.getElementById('fsPrev');
const fsNext=document.getElementById('fsNext');
const assistantOpen=document.getElementById('assistantOpen');
const fsAssistantOpen=document.getElementById('fsAssistantOpen');
const assistantPanel=document.getElementById('assistantPanel');
const assistantClose=document.getElementById('assistantClose');
const assistantTitle=document.getElementById('assistantTitle');
const assistantBody=document.getElementById('assistantBody');
const ASSISTANT_ENDPOINT='https://itpf-course-assistant.ukrsedo-e2e.workers.dev/explain-slide';
const explanationCache=new Map();
let assistantRequestController=null;
let current=0;
slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(s.n).padStart(2,'0')+' — '+s.title;picker.appendChild(o)});
function flash(text){toast.textContent=text;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),900)}
function setAssistantOpen(open){
  assistantPanel.classList.toggle('open',open);
  framewrap.classList.toggle('assistant-open',open);
  assistantPanel.setAttribute('aria-hidden',open?'false':'true');
  if(!open&&assistantRequestController){assistantRequestController.abort();assistantRequestController=null}
}
function closeAssistant(){setAssistantOpen(false)}
function showAssistantLoading(slide){
  assistantTitle.textContent='Slide '+slide.n+' — '+slide.title.replace(/^ITPF\s*[—-]\s*Slide\s*\d+\s*[—-]?\s*/i,'').replace(/^Slide\s*\d+\s*[—-]?\s*/i,'');
  assistantBody.innerHTML='';
  const status=document.createElement('div');status.className='assistant-status';
  const spinner=document.createElement('span');spinner.className='assistant-spinner';spinner.setAttribute('aria-hidden','true');
  const text=document.createElement('span');text.textContent='Preparing the explanation…';
  status.append(spinner,text);assistantBody.appendChild(status);
}
function showAssistantExplanation(text){
  assistantBody.innerHTML='';
  const div=document.createElement('div');div.className='assistant-explanation';div.textContent=text;assistantBody.appendChild(div);
}
function showAssistantError(message){
  assistantBody.innerHTML='';
  const box=document.createElement('div');box.className='assistant-error';box.textContent=message;assistantBody.appendChild(box);
  const retry=document.createElement('button');retry.type='button';retry.className='assistant-retry';retry.textContent='Try again';retry.onclick=explainCurrentSlide;assistantBody.appendChild(retry);
}
async function explainCurrentSlide(){
  const slide=slides[current];
  setAssistantOpen(true);
  if(explanationCache.has(slide.n)){
    assistantTitle.textContent='Slide '+slide.n+' — '+slide.title.replace(/^ITPF\s*[—-]\s*Slide\s*\d+\s*[—-]?\s*/i,'').replace(/^Slide\s*\d+\s*[—-]?\s*/i,'');
    showAssistantExplanation(explanationCache.get(slide.n));
    return;
  }
  showAssistantLoading(slide);
  if(assistantRequestController)assistantRequestController.abort();
  assistantRequestController=new AbortController();
  const timeout=setTimeout(()=>assistantRequestController.abort(),30000);
  try{
    const response=await fetch(ASSISTANT_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slideNumber:slide.n}),
      signal:assistantRequestController.signal
    });
    let data;
    try{data=await response.json()}catch{throw new Error('The Course Assistant returned an unreadable response.')}
    if(!response.ok||!data.success)throw new Error(data.error||data.details||'The Course Assistant could not explain this slide.');
    const explanation=String(data.explanation||'').trim();
    if(!explanation)throw new Error('The Course Assistant returned no explanation.');
    explanationCache.set(slide.n,explanation);
    if(slides[current].n===slide.n&&assistantPanel.classList.contains('open'))showAssistantExplanation(explanation);
  }catch(error){
    if(error.name==='AbortError'){
      if(assistantPanel.classList.contains('open'))showAssistantError('The request timed out. Please try again.');
    }else if(assistantPanel.classList.contains('open')){
      const originHint=location.protocol==='file:'?' Open the presentation from Good Spending or GitHub Pages rather than as a local file.':'';
      showAssistantError((error.message||'The Course Assistant is unavailable.')+originHint);
    }
  }finally{clearTimeout(timeout);assistantRequestController=null}
}
assistantOpen.onclick=explainCurrentSlide;
fsAssistantOpen.onclick=explainCurrentSlide;
assistantClose.onclick=closeAssistant;
assistantPanel.addEventListener('keydown',e=>{if(e.key==='Escape')closeAssistant()});
function show(index,updateHash=true){
  current=Math.max(0,Math.min(slides.length-1,index));
  closeAssistant();
  frame.src=slides[current].src;
  picker.value=String(current);
  counter.textContent=(current+1)+' / '+slides.length;
  fsCounter.textContent=(current+1)+' / '+slides.length;
  prev.disabled=current===0;next.disabled=current===slides.length-1;
  fsPrev.disabled=current===0;fsNext.disabled=current===slides.length-1;
  document.title='Slide '+(current+1)+' — IT Procurement Foundations';
  if(updateHash) history.replaceState(null,'','#'+(current+1));
}
function go(d){show(current+d)}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);fsPrev.onclick=()=>go(-1);fsNext.onclick=()=>go(1);picker.onchange=()=>show(Number(picker.value));
async function toggleDeckFullscreen(){
  try{
    const active=document.fullscreenElement||document.webkitFullscreenElement;
    if(!active){
      const request=framewrap.requestFullscreen||framewrap.webkitRequestFullscreen;
      if(!request) throw new Error('Fullscreen unsupported');
      await request.call(framewrap);
    }else{
      const exit=document.exitFullscreen||document.webkitExitFullscreen;
      if(exit) await exit.call(document);
    }
  }catch(e){flash('Use the browser full-screen command')}
}
document.getElementById('full').onclick=toggleDeckFullscreen;
function keynav(e){
 if(e.key==='Escape'&&assistantPanel.classList.contains('open')){e.preventDefault();closeAssistant();return;}
 const tag=(e.target&&e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select')return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}
 else if(e.key==='Home'){e.preventDefault();show(0)} else if(e.key==='End'){e.preventDefault();show(slides.length-1)}
}
window.addEventListener('keydown',keynav);
window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow||!e.data||e.data.type!=='ITPF_DECK_NAV')return;
  if(e.data.action==='next')go(1);
  else if(e.data.action==='prev')go(-1);
  else if(e.data.action==='first')show(0);
  else if(e.data.action==='last')show(slides.length-1);
  else if(e.data.action==='fullscreen')toggleDeckFullscreen();
});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(Number.isFinite(n)&&n>=1&&n<=slides.length)show(n-1,false)});
const requested=parseInt(location.hash.slice(1),10);show(Number.isFinite(requested)&&requested>=1&&requested<=slides.length?requested-1:0,false);
</script>
