  background:#f8fafc;

.assistant-button{

.framewrap{position:relative;min-height:0;overflow:hidden;background:var(--stage)}

.fullscreen-nav{

  transform:translateX(-50%);

  gap:7px;
  padding:7px;

@media(max-width:470px){
  .counter-box{display:none}
  .picker-wrap{padding-right:5px}
}
</style>

    let data;
    try{data=await response.json()}catch{throw new Error('The Course Assistant returned an unreadable response.')}
    if(!response.ok||!data.success)throw new Error(data.error||data.details||'The Course Assistant could not explain this slide.');
    const explanation=String(data.explanation||'').trim();
    if(!explanation)throw new Error('The Course Assistant returned no explanation.');
    explanationCache.set(slide.n,explanation);
    if(slides[current].n===slide.n&&assistantPanel.classList.contains('open'))showAssistantExplanation(explanation);
  }catch(error){
    if(error.name==='AbortError'){
      if(assistantPanel.classList.contains('open'))showAssistantError('The request timed out. Please try again.');
    }else if(assistantPanel.classList.contains('open')){
      const originHint=location.protocol==='file:'?' Open the presentation from Good Spending or GitHub Pages rather than as a local file.':'';
      showAssistantError((error.message||'The Course Assistant is unavailable.')+originHint);
    }
  }finally{clearTimeout(timeout);assistantRequestController=null}
}
assistantOpen.onclick=explainCurrentSlide;
fsAssistantOpen.onclick=explainCurrentSlide;
assistantClose.onclick=closeAssistant;
assistantPanel.addEventListener('keydown',e=>{if(e.key==='Escape')closeAssistant()});
function show(index,updateHash=true){
  current=Math.max(0,Math.min(slides.length-1,index));
  closeAssistant();
  frame.src=slides[current].src;
  picker.value=String(current);
  counter.textContent=(current+1)+' / '+slides.length;
  fsCounter.textContent=(current+1)+' / '+slides.length;
  prev.disabled=current===0;next.disabled=current===slides.length-1;
  fsPrev.disabled=current===0;fsNext.disabled=current===slides.length-1;
  document.title='Slide '+(current+1)+' — IT Procurement Foundations';
  if(updateHash) history.replaceState(null,'','#'+(current+1));
}
function go(d){show(current+d)}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);fsPrev.onclick=()=>go(-1);fsNext.onclick=()=>go(1);picker.onchange=()=>show(Number(picker.value));
async function toggleDeckFullscreen(){
  try{
    const active=document.fullscreenElement||document.webkitFullscreenElement;
    if(!active){
      const request=framewrap.requestFullscreen||framewrap.webkitRequestFullscreen;
      if(!request) throw new Error('Fullscreen unsupported');
      await request.call(framewrap);
    }else{
      const exit=document.exitFullscreen||document.webkitExitFullscreen;
      if(exit) await exit.call(document);
    }
  }catch(e){flash('Use the browser full-screen command')}
}
document.getElementById('full').onclick=toggleDeckFullscreen;
function keynav(e){
 if(e.key==='Escape'&&assistantPanel.classList.contains('open')){e.preventDefault();closeAssistant();return;}
 const tag=(e.target&&e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select')return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}
 else if(e.key==='Home'){e.preventDefault();show(0)} else if(e.key==='End'){e.preventDefault();show(slides.length-1)}
}
window.addEventListener('keydown',keynav);
window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow||!e.data||e.data.type!=='ITPF_DECK_NAV')return;
  if(e.data.action==='next')go(1);
  else if(e.data.action==='prev')go(-1);
  else if(e.data.action==='first')show(0);
  else if(e.data.action==='last')show(slides.length-1);
  else if(e.data.action==='fullscreen')toggleDeckFullscreen();
});
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(Number.isFinite(n)&&n>=1&&n<=slides.length)show(n-1,false)});
const requested=parseInt(location.hash.slice(1),10);show(Number.isFinite(requested)&&requested>=1&&requested<=slides.length?requested-1:0,false);
</script>
