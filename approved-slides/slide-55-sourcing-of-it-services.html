<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slide 55 — Sourcing of IT Services</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe5eb;font-family:Arial,Helvetica,sans-serif;color:#003b70}.stage{height:100%;display:grid;place-items:center;padding:18px}.slide{position:relative;aspect-ratio:16/9;width:min(100%,calc((100vh - 36px)*16/9));background:#fff;overflow:hidden;box-shadow:0 18px 60px #0019372e}.logo{position:absolute;right:4.3%;top:4%;width:10%}.content{position:absolute;left:8%;top:31%;right:28%}.session{display:flex;gap:12px;align-items:center;font-size:clamp(17px,1.6vw,30px);margin-bottom:24px}.dot{width:15px;height:15px;border:4px solid #12bddf;border-radius:50%}h1{font-size:clamp(46px,5.8vw,112px);line-height:1.08;letter-spacing:-.03em;margin:0;font-weight:800}.accent{margin-top:32px;width:110px;height:7px;background:#12bddf}.number{position:absolute;right:6%;bottom:13%;font-size:clamp(150px,22vw,420px);font-weight:800;line-height:1;color:#eaf2f7;letter-spacing:-.08em;user-select:none}.rule{position:absolute;left:8%;right:8%;bottom:9%;height:2px;background:#dce8f0}.rule:before{content:"";display:block;width:18%;height:2px;background:#12bddf}
</style></head><body><main class="stage"><section class="slide" aria-label="Sourcing of IT Services"><img data-itpf-cips-logo class="logo" src="../assets/cips-logo.png" alt="CIPS"><div class="number" aria-hidden="true">04</div><div class="content"><div class="session"><span class="dot"></span>Session 4</div><h1>Sourcing of<br>IT Services</h1><div class="accent" aria-hidden="true"></div></div><div class="rule" aria-hidden="true"></div></section></main><script id="itpf-deck-bridge">
(function(){
  function send(action){ if(window.parent!==window) window.parent.postMessage({type:'ITPF_DECK_NAV',action:action},'*'); }
  window.addEventListener('keydown',function(e){
    var t=e.target, tag=(t&&t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
    var action=null;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') action='next';
    else if(e.key==='ArrowLeft'||e.key==='PageUp') action='prev';
    else if(e.key==='Home') action='first';
    else if(e.key==='End') action='last';
    if(action){ e.preventDefault(); e.stopPropagation(); send(action); }
  },true);
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!b) return;
    var label=(b.textContent||'').trim().toLowerCase();
    if(label==='full screen'||label==='fullscreen'||label==='⛶'){
      e.preventDefault(); e.stopImmediatePropagation(); send('fullscreen');
    }
  },true);
})();
</script>
<style>html.itpf-cips-hidden img[data-itpf-cips-logo]{visibility:hidden!important}</style>
<script id="itpf-cips-visibility">
(function(){
 function apply(visible){
  document.documentElement.classList.toggle('itpf-cips-hidden',!visible);
  document.querySelectorAll('img[data-itpf-cips-free]').forEach(function(img){
   if(!img.dataset.itpfCipsOriginal)img.dataset.itpfCipsOriginal=img.getAttribute('src');
   img.src=visible?img.dataset.itpfCipsOriginal:img.dataset.itpfCipsFree;
  });
 }
 try{apply(localStorage.getItem('itpf.cipsLogo.visible')!=='false')}catch(e){}
 window.addEventListener('message',function(e){if(e.source===window.parent&&e.data&&e.data.type==='ITPF_CIPS_VISIBILITY')apply(e.data.visible===true)});
})();
</script>
</body>
</html>
