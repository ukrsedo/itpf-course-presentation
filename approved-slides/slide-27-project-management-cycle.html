.empty{margin:auto;text-align:center;color:#5e7286;font-size:clamp(16px,1.1vw,22px);line-height:1.3;max-width:74%;font-weight:750}
ul{list-style:none;margin:.75rem 0 0;padding:0 1rem 1rem;overflow:auto;display:flex;flex-direction:column;gap:.6rem}
li{border-left:5px solid var(--cyan);background:#f6f9fb;padding:.65rem .8rem;border-radius:0 8px 8px 0;font-size:clamp(14px,1vw,19px);line-height:1.25;font-weight:700;overflow-wrap:anywhere}

<script>
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.panel).classList.add('active');
}));

const WORKER_URL = "https://itpf-live-responses.ukrsedo-e2e.workers.dev";
const SESSION_ID = "ITPF-2026-09-10-11";
const QUESTION_ID = "PROJECT-END-01";
const REFRESH_INTERVAL_MS = 15000;

const input = document.getElementById('input');
const submit = document.getElementById('submit');
const chars = document.getElementById('chars');
const message = document.getElementById('message');
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
let submitting = false;

input.addEventListener('input', () => { chars.textContent = input.value.length; message.textContent = ''; });

function endpoint() { return `${WORKER_URL.replace(/\/$/, '')}/responses`; }

function setMessage(text, type='info') {
  message.textContent = text;
  message.style.color = type === 'error' ? '#a22' : type === 'success' ? '#197241' : '#5e7286';
}

function renderResponses(items) {
  list.replaceChildren();
  for (const item of items) {
    const li = document.createElement('li');
    li.textContent = item.response || item.text || '';
    list.appendChild(li);
  }
  empty.hidden = items.length > 0;
  count.textContent = `${items.length} response${items.length === 1 ? '' : 's'}`;
}

async function loadResponses(showError=false) {
  try {
    const url = new URL(endpoint());
    url.searchParams.set('sessionId', SESSION_ID);
    url.searchParams.set('questionId', QUESTION_ID);
    const response = await fetch(url, { method: 'GET', cache: 'no-store' });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || 'Unable to load responses.');
    renderResponses(Array.isArray(data.responses) ? data.responses : []);
  } catch (error) {
    if (showError) setMessage(error.message || 'Unable to load responses.', 'error');
  }
}

async function submitResponse() {
  if (submitting) return;
  const value = input.value.trim().replace(/\s+/g, ' ');
  if (!value) { setMessage('Please enter a response.', 'error'); return; }

  submitting = true;
  submit.disabled = true;
  submit.textContent = 'Submitting…';
  setMessage('');

  try {
    const response = await fetch(endpoint(), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        sessionId: SESSION_ID,
        questionId: QUESTION_ID,
        responseId: (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`),
        response: value
      })
    });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || 'Submission failed.');
    input.value = '';
    chars.textContent = '0';
    setMessage('Submitted.', 'success');
    await loadResponses(true);
    input.focus();
  } catch (error) {
    setMessage(`${error.message || 'Submission failed.'} Your text has not been cleared.`, 'error');
  } finally {
    submitting = false;
    submit.disabled = false;
    submit.textContent = 'Submit';
  }
}

submit.addEventListener('click', submitResponse);
loadResponses(false);
setInterval(() => loadResponses(false), REFRESH_INTERVAL_MS);
</script>
<script id="itpf-deck-bridge">
(function(){
  function send(action){ if(window.parent!==window) window.parent.postMessage({type:'ITPF_DECK_NAV',action:action},'*'); }
  window.addEventListener('keydown',function(e){
    var t=e.target, tag=(t&&t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
    var action=null;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') action='next';
    else if(e.key==='ArrowLeft'||e.key==='PageUp') action='prev';
    else if(e.key==='Home') action='first';
    else if(e.key==='End') action='last';
    if(action){ e.preventDefault(); e.stopPropagation(); send(action); }
  },true);
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!b) return;
    var label=(b.textContent||'').trim().toLowerCase();
    if(label==='full screen'||label==='fullscreen'||label==='⛶'){
      e.preventDefault(); e.stopImmediatePropagation(); send('fullscreen');
    }
  },true);
})();
</script>
<style>html.itpf-cips-hidden img[data-itpf-cips-logo]{visibility:hidden!important}</style>
<script id="itpf-cips-visibility">
(function(){
 function apply(visible){
  document.documentElement.classList.toggle('itpf-cips-hidden',!visible);
  document.querySelectorAll('img[data-itpf-cips-free]').forEach(function(img){
   if(!img.dataset.itpfCipsOriginal)img.dataset.itpfCipsOriginal=img.getAttribute('src');
   img.src=visible?img.dataset.itpfCipsOriginal:img.dataset.itpfCipsFree;
  });
 }
 try{apply(localStorage.getItem('itpf.cipsLogo.visible')!=='false')}catch(e){}
 window.addEventListener('message',function(e){if(e.source===window.parent&&e.data&&e.data.type==='ITPF_CIPS_VISIBILITY')apply(e.data.visible===true)});
})();
</script>
