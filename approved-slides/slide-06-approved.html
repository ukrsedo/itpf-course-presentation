<!doctype html>
<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>ITPF — Slide 6 Draft</title>
<style>
:root{--navy:#003b70;--cyan:#00b7e5;--magenta:#c00067;--paper:#fff;--ink:#183d61;--soft:#f3fbff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe5eb;font-family:Arial,Helvetica,sans-serif}
.stage{width:100%;height:100%;display:grid;place-items:center;padding:18px}
.slide{position:relative;aspect-ratio:16/9;width:min(100%,calc((100vh - 36px)*16/9));background:var(--paper);box-shadow:0 18px 60px rgba(0,25,55,.18);overflow:hidden}
.logo{position:absolute;right:4.3%;top:4.1%;width:10.5%;height:auto;z-index:3}
.content{position:absolute;left:7%;top:20%;width:72%;z-index:2}
.kicker{display:inline-flex;align-items:center;gap:12px;color:var(--navy);font-size:clamp(18px,1.55vw,29px);font-weight:700;margin-bottom:3.4%}
.kicker:before{content:"";width:14px;height:14px;border:5px solid var(--cyan);border-radius:50%;display:inline-block}
h1{margin:0;color:var(--navy);font-size:clamp(58px,6.2vw,108px);line-height:.95;letter-spacing:-.04em;font-weight:800}
.session{margin-top:2.6%;font-size:clamp(24px,2.35vw,43px);line-height:1.08;color:var(--magenta);font-weight:800}
.subline{margin-top:2.1%;height:8px;width:28%;background:linear-gradient(90deg,var(--cyan),var(--navy));border-radius:99px}
.corner{position:absolute;left:-7%;bottom:-19%;width:45%;aspect-ratio:1/1;border:38px solid rgba(0,183,229,.18);border-radius:50%;z-index:1}
.corner:after{content:"";position:absolute;left:16%;top:16%;width:56%;height:56%;border:24px solid rgba(0,59,112,.12);border-radius:50%}
.diagonal{position:absolute;right:-13%;bottom:-20%;width:48%;height:54%;background:linear-gradient(135deg,rgba(0,59,112,.06),rgba(0,183,229,.16));transform:skewX(-18deg);z-index:0}
.footer{position:absolute;left:5.2%;right:5.2%;bottom:2.05%;display:flex;justify-content:space-between;color:#607588;font-size:clamp(10px,.72vw,13px);z-index:3}
.rule{position:absolute;left:0;bottom:0;width:100%;height:8px;background:linear-gradient(90deg,var(--navy) 0 32%,var(--cyan) 32% 100%);z-index:3}
.controls{position:absolute;right:1.7%;bottom:1.6%;opacity:.15;transition:.2s;z-index:4}.slide:hover .controls{opacity:.85}button{border:1px solid #c8d3df;background:#fff;color:var(--navy);border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}
</style></head><body><div class="stage"><section aria-label="Setting the Scene section divider" class="slide">
<img alt="CIPS" class="logo" src="../assets/cips-logo.png"/>
<div class="content"><div class="kicker">Day 1</div><h1>Setting the Scene</h1><div class="session">Session 1</div><div class="subline"></div></div>
<div class="corner"></div><div class="diagonal"></div>
<div class="footer"><span>Technology (IT) Procurement Foundations</span><span>6</span></div><div class="rule"></div><div class="controls"><button onclick="parent.postMessage({type:'ITPF_DECK_NAV',action:'fullscreen'},'*')">Full screen</button></div>
</section></div>
<script id="itpf-deck-bridge">
(function(){
  function send(action){ if(window.parent!==window) window.parent.postMessage({type:'ITPF_DECK_NAV',action:action},'*'); }
  window.addEventListener('keydown',function(e){
    var t=e.target, tag=(t&&t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
    var action=null;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') action='next';
    else if(e.key==='ArrowLeft'||e.key==='PageUp') action='prev';
    else if(e.key==='Home') action='first';
    else if(e.key==='End') action='last';
    if(action){ e.preventDefault(); e.stopPropagation(); send(action); }
  },true);
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!b) return;
    var label=(b.textContent||'').trim().toLowerCase();
    if(label==='full screen'||label==='fullscreen'||label==='⛶'){
      e.preventDefault(); e.stopImmediatePropagation(); send('fullscreen');
    }
  },true);
})();
</script>
</body></html>
