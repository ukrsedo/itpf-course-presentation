<script id="itpf-deck-bridge">
(function(){
  function send(action){ if(window.parent!==window) window.parent.postMessage({type:'ITPF_DECK_NAV',action:action},'*'); }
  window.addEventListener('keydown',function(e){
    var t=e.target, tag=(t&&t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
    var action=null;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') action='next';
    else if(e.key==='ArrowLeft'||e.key==='PageUp') action='prev';
    else if(e.key==='Home') action='first';
    else if(e.key==='End') action='last';
    if(action){ e.preventDefault(); e.stopPropagation(); send(action); }
  },true);
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!b) return;
    var label=(b.textContent||'').trim().toLowerCase();
    if(label==='full screen'||label==='fullscreen'||label==='⛶'){
      e.preventDefault(); e.stopImmediatePropagation(); send('fullscreen');
    }
  },true);
})();
</script>
