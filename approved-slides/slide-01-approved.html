<!doctype html>
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>ITPF — Slide 1 Draft</title>
<style>
:root{
  --navy:#002b52;
  --blue:#0078e8;
  --paper:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#dfe5eb;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.stage{width:100%;height:100%;display:grid;place-items:center;padding:18px}
.slide{
  position:relative;
  aspect-ratio:16/9;
  width:min(100%,calc((100vh - 36px)*16/9));
  background:var(--paper);
  overflow:hidden;
  box-shadow:0 18px 60px rgba(0,25,55,.18);
}
.logo{position:absolute;right:4.2%;top:5%;width:10.4%;height:auto}
.content{position:absolute;left:7.9%;top:29.6%;width:67%}
h1{margin:0;color:var(--navy);font-size:clamp(34px,4.65vw,75px);line-height:1.27;font-weight:700;letter-spacing:-.02em}
.subtitle{margin-top:1.45%;color:var(--blue);font-size:clamp(18px,1.7vw,30px);font-weight:700}
.dates{margin-top:1.15%;color:var(--navy);font-size:clamp(16px,1.35vw,24px);font-weight:700;letter-spacing:.01em}
.chevron{position:absolute;left:-2%;bottom:-14%;width:42%;height:54%;transform:rotate(0deg);opacity:.7}
.chevron::before,.chevron::after{content:"";position:absolute;background:linear-gradient(135deg,rgba(0,43,82,.015),rgba(0,43,82,.055),rgba(0,43,82,.01));clip-path:polygon(0 0,23% 0,100% 100%,77% 100%)}
.chevron::before{inset:0 40% 0 0}
.chevron::after{inset:0 0 0 38%}
.controls{position:absolute;right:2%;bottom:2%;display:flex;gap:8px;opacity:.2;transition:opacity .2s}
.slide:hover .controls{opacity:.8}
button{border:1px solid #c8d3df;background:white;color:var(--navy);border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}
@media (max-width:700px){.content{left:7%;top:27%;width:75%}.logo{width:15%;right:5%}}
</style>
</head>
<body>
<div class="stage">
<section aria-label="Technology IT Procurement Foundations title slide" class="slide">
<img alt="CIPS logo" class="logo" src="../assets/cips-logo.png"/>
<div class="content">
<h1>Technology (IT) Procurement<br/>Foundations</h1>
<div class="subtitle">Procurement Training</div>
<div class="dates">10–11 September 2026</div>
</div>
<div aria-hidden="true" class="chevron"></div>
<div class="controls"><button onclick="parent.postMessage({type:'ITPF_DECK_NAV',action:'fullscreen'},'*')">Full screen</button></div>
</section>
</div>
<script id="itpf-deck-bridge">
(function(){
  function send(action){ if(window.parent!==window) window.parent.postMessage({type:'ITPF_DECK_NAV',action:action},'*'); }
  window.addEventListener('keydown',function(e){
    var t=e.target, tag=(t&&t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
    var action=null;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') action='next';
    else if(e.key==='ArrowLeft'||e.key==='PageUp') action='prev';
    else if(e.key==='Home') action='first';
    else if(e.key==='End') action='last';
    if(action){ e.preventDefault(); e.stopPropagation(); send(action); }
  },true);
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!b) return;
    var label=(b.textContent||'').trim().toLowerCase();
    if(label==='full screen'||label==='fullscreen'||label==='⛶'){
      e.preventDefault(); e.stopImmediatePropagation(); send('fullscreen');
    }
  },true);
})();
</script>
</body>
</html>
